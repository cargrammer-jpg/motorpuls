# Märken och modeller som redan finns som taggar i content/articles.
# build.py skapar /marke/<slug>/ eller /modell/<slug>/ först när minst min_articles
# publicerade artiklar matchar taggen eller ett alias. En modell räknas också
# in på sitt märke. Artiklar med framtida datum tas inte med.
#
# Lämna intro, specs och price tomma. Då visas bara meningen
# "Alla Motorpuls artiklar om <namn>." Inga specifikationer eller priser skrivs ut.
# Fyll bara i ett fält när uppgiften ska stå på sidan.

