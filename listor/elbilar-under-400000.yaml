# Kontrollerad 2026-11-23. Inga tankstreck i filen.
# Fält: title, ingress, faq, rows (modell, värde, värden, källa, kontrollerad).
slug: elbilar-under-400000
granskning: 'Granskad 2026-11-23, Godkänd efter ändringar'
title: Elbilar du kan köpa nya i Sverige under 400 000 kronor
ingress: Tabellen visar rekommenderade listpriser för instegsversioner, hämtade från tillverkarnas svenska prislistor och modelsidor den 23 november 2026. Alla bilar i listan kostar under 400 000 kronor inklusive moms. Räckvidden anges enligt WLTP, och preliminära värden är märkta.
faq:
- fraga: Är listpriset vad jag faktiskt betalar?
  svar: Inte nödvändigtvis. Siffrorna är tillverkarnas rekommenderade cirkapriser inklusive moms för instegsversionen, om inget annat sägs. Återförsäljaren sätter det slutliga priset. Rabatter, färg, tillval och inbyte räknas inte in här.
- fraga: Varför anges WLTP och inte vinterräckvidd?
  svar: WLTP är den officiella räckvidd som tillverkaren redovisar och som går att jämföra mellan modeller. För Citroën ë-C3, Kia EV2 och Hyundai Ioniq 3 är värdet ännu preliminärt enligt tillverkaren, och det står i tabellen. Den är mätt i laboratorium och blir oftast kortare i kyla och på landsväg. Vintervärden finns i en separat lista, men bara för bilar som ingått i publicerade tester.
- fraga: Vad gäller för kampanjpriser?
  svar: Škoda Epiq 35 Essence har ett tidsbegränsat erbjudande på 315 900 kronor till och med 15 december 2026. Ordinarie rekommenderat cirkapris är 334 500 kronor enligt Škodas prislista den 30 oktober 2026. I tabellen står båda beloppen.
- fraga: Finns det fler elbilar under 400 000 kronor?
  svar: Troligen ja. Rader är utelämnade när ett aktuellt svenskt listpris eller en officiell WLTP-räckvidd inte har kunnat öppnas och verifieras i dag. Det gäller bland annat flera modeller där bara månadspriser eller ofullständiga uppgifter fanns på tillverkarens sida.
- fraga: Ingår vinterdäck, hemleverans eller premie i priset?
  svar: Nej. Tabellen visar bara det rekommenderade listpriset för angiven version. Eventuell elbilspremie, extrautrustning, hemleverans och vinterhjul tillkommer eller villkoras separat.
metod: Varje rad har ett svenskt listpris för instegsversionen och en WLTP-räckvidd från tillverkaren, från en källa som öppnats den 23 november 2026. Preliminära WLTP-värden är märkta i raden. Citroëns pris kommer från sidan Rätt pris direkt och är inte uttryckligen märkt som rekommenderat cirkapris. Primärkällor är tillverkarnas svenska prislistor och modelsidor. Modeller där pris eller räckvidd inte kunde verifieras är utelämnade.
osakerheter:
- 'Citroën ë-C3: modelsidan anger räckvidd upp till 320 km enligt WLTP, men märker uppgiften som föremål för godkännande.'
- 'Kia EV2: modelsidans fotnot säger att all teknisk data är förväntade måltal i väntan på vidareutveckling och homologering. WLTP 317 och 453 km är därför märkta som preliminära. Priserna kommer från Kia Sveriges prislista publicerad 1 november 2026, gällande till 30 november 2026.'
- 'Škoda Epiq 35 Essence: 315 900 kronor är ett tidsbegränsat erbjudande till och med 15 december 2026. Ordinarie rekommenderat cirkapris är 334 500 kronor.'
- Flera troliga modeller under 400 000 kronor saknas, bland annat MG4, Fiat Grande Panda, Volkswagen ID. Polo, Nissan Micra, Opel, Peugeot, Mini, Suzuki, Ford Puma Gen-E och Leapmotor B10, eftersom officiellt svenskt listpris och WLTP inte kunde verifieras samtidigt i dag.
- 'Hyundai Ioniq 3: modelsidan kallar WLTP-räckvidden uppskattad. 344 och 497 km är därför märkta som preliminära.'
- 'Hyundai Inster: WLTP 327 km kommer från en svensk modellbroschyr daterad december 2024. Prislistan från november 2026 anger inte räckvidd.'
- Prislistor kan ändras utan förvarning. Datumet för kontroll är 23 november 2026.
