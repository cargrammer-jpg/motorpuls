# Motorpuls listsida, utkast till Dr. Webb. Publiceras inte.
# Kontrollerad 2026-11-23. Inga tankstreck i filen.
# Fält: title, ingress, faq, rows (modell, värde, värden, källa, kontrollerad).
slug: rackvidd-kyla
granskning: 'Granskad 2026-11-23, Godkänd efter ändringar'
title: Så långt kom elbilarna i NAF och Motors vintertest 2025 och 2026
ingress: NAF och Motor har mätt vinterräckvidd i två skilda tester. 2025 kördes i milt väder, 2026 i kyla ner till minus 32 grader. Siffrorna går därför inte att jämföra rakt av. Tabellen anger test, temperatur, WLTP och uppmätt sträcka.
faq:
- fraga: Varför ska jag inte jämföra 2025 och 2026 rakt av?
  svar: Testerna kördes i helt olika temperaturer. 2025 låg temperaturen mellan minus 6 och plus 8 grader, och bilarna tappade i snitt omkring 18 till 19 procent mot WLTP. 2026 låg temperaturen mellan minus 7 och minus 32 grader, och snittet blev minus 38 procent. En bra siffra i milt väder säger inte hur samma bil beter sig i sträng kyla.
- fraga: Vad är WLTP-räckvidd?
  svar: WLTP är den officiella laboratoriemätningen av räckvidd, Worldwide Harmonised Light Vehicle Test Procedure. Den används för att jämföra bilar under likadana villkor, men den återger inte vinterkörning på väg. I tabellen står därför både bilens WLTP i testet och den sträcka NAF och Motor faktiskt körde.
- fraga: När avbröts mätningen?
  svar: Bilarna kördes tills föraren märkte effektförlust, och från 2025 tills bilen inte längre kunde hålla hastighetsgränsen på platsen. Det är alltså inte alltid tomt batteri. Enligt NAF märkte flera förare 2026 ett ovanligt kraftbortfall redan vid omkring 10 procent kvar på batteriet.
- fraga: Varför är avvikelsen också olika inom samma test 2026?
  svar: Temperaturen sjönk längs sträckan, från minus 7 grader i Oslo till ner mot minus 32 grader. Där Hyundai Inster stannade var det minus 16 grader, enligt NAF. Bilar som rullade längre hann alltså möta hårdare kyla. Därför är procentavvikelsen inte en helt rättvis rangordning av teknik, utan ett resultat under de förhållanden varje bil hann möta.
- fraga: Gäller siffrorna för precis den version jag kan köpa i Sverige i dag?
  svar: Nej, inte automatiskt. NAF anger WLTP för den aktuella testbilen. Fälgar, utrustning och senare uppdateringar kan ge en annan officiell räckvidd än den som stod i testet. Använd tabellen som en uppmätt referens, inte som en garanti för din bil.
metod: Bara publicerade mätningar med tydlig metod är med. Alla rader kommer från NAF och Motors El Prix. Vinter 2026 och vinter 2025 är märkta var för sig och får inte läsas som ett enda test. Primärkälla för tabellsiffror är NAF:s officiella pressmeddelanden. Testsidorna på naf.no är öppnade för metod, temperatur och kompletterande detaljer. Modeller som inte tydligt säljs i Sverige är utelämnade.
osakerheter:
- I NAF:s pressmeddelande för vinter 2026 står Lucid Air för 520 km i tabellen, medan brödtexten på naf.no anger 519 km. Lucid Air är ändå utelämnad eftersom svensk försäljning inte har verifierats här.
- NAF:s pressmeddelande för vinter 2025 anger temperaturer mellan minus 6 och plus 5 grader. Testsida för samma test nämner upp till plus 8 grader på fjället. Tabellen beskriver intervallet som minus 6 till plus 8 grader, med den skillnaden noterad.
- Tesla Model 3 har minus 24 procent i 2025 års pressmeddelandetabell. NAF:s testsida preciserar avvikelsen till minus 23,6 procent. Tabellen följer pressmeddelandets avrundning, som för övriga rader.
- Audi Q6 e-tron har minus 23 procent i 2025 års pressmeddelandetabell. Egen uträkning av 477 km mot 616 km ger minus 22,6 procent. Tabellen följer pressmeddelandet.
- Mini Countryman anges till 358 km i pressmeddelandet och 357,6 km på testsidan. Tabellen följer pressmeddelandets 358 km.
- I 2026 års test startade Opel Grandland med 94 procent batteri efter att laddningen stannat över natten. Det är markerat på raden.
- NAF:s 2026-tabell skriver MG6S, medan löptext ibland säger MG S6. Radens modellnamn följer tabellen, med förklaring i anmärkningen. MG IM6, KGM Musso, Voyah Courage, Changan Deepal S05, Xpeng X9, Zeekr 7X och Lucid Air är utelämnade eftersom svensk försäljning inte har verifierats här.
