# Motorpuls listsida, utkast till Dr. Webb. Publiceras inte.
# Kontrollerad 2026-11-23. Inga tankstreck i filen.
# Fält: title, ingress, faq, rows (modell, värde, värden, källa, kontrollerad).
slug: elbilar-dragkrok
granskning: 'Granskad 2026-11-23, Godkänd efter ändringar'
title: Så tungt släp får populära elbilar dra, från 500 till 2 500 kilo
ingress: Dragvikten skiljer sig stort mellan modeller, och ofta även mellan versioner av samma bil. I tabellen är den högsta bromsade släpvagnsvikten 2 500 kilo. Siffrorna är hämtade ur tillverkarnas tekniska data den 23 november 2026.
faq:
- fraga: Vad är skillnaden mellan bromsad och obromsad släpvagnsvikt?
  svar: Bromsad vikt är den högsta tillåtna vikten på ett släp som har egna bromsar. Obromsad vikt gäller släp utan egna bromsar och är lägre. I tabellen är den högst 750 kilo där tillverkaren anger den. Enligt Škoda Sverige är det släpets vikt inklusive last som räknas.
- fraga: Räcker ett vanligt B-körkort för de tyngsta elbilarna?
  svar: Inte alltid. Bilen kan ha teknisk rätt att dra 2 000 kilo eller mer, men körkortet sätter egna tak. Enligt Škoda Sveriges genomgång får släpet med B-körkort väga högst 750 kilo, eller mer om bilens och släpets sammanlagda totalvikt är högst 3 500 kilo. Med utökad B-behörighet (B96) får ekipaget väga högst 4 250 kilo. Med BE får släpet väga högst 3 500 kilo, om bilen tekniskt klarar det. Kontrollera alltid registreringsbeviset och Transportstyrelsens släpvagnskalkylator.
- fraga: Varför har samma modell olika dragvikt?
  svar: Batteristorlek, motor och drivning kan ändra den godkända släpvagnsvikten. Kia EV9 med standardbatteri får dra 900 kilo bromsat släp, medan AWD Long Range får dra 2 500 kilo. Ange därför alltid version, inte bara modellnamn.
- fraga: Ingår dragkroken när jag köper bilen?
  svar: Ofta inte. Flera tillverkare säljer kroken som tillval. Škoda uppger att Epiq Essence inte kan få dragkrok alls, medan Selection och Sportline har krok som standard. Fråga återförsäljaren vad som gäller för just den version du tittar på.
- fraga: Hur påverkar ett släp räckvidden?
  svar: Enligt Škoda Sverige ökar energiförbrukningen med släp, så räckvidden blir kortare. Det beror bland annat på släpets vikt och att luftmotståndet kan öka. Hur mycket beror på släpets storlek och form, hastighet, väder och körförhållanden. Planera laddstoppen i förväg.
metod: Varje rad bygger på tekniska data eller faktablad som öppnats den 23 november 2026. Svenska tillverkarsidor och svenska faktablad har använts i första hand. Teslas ägarmanualer kunde inte öppnas direkt på tesla.com (åtkomsten blockerades) och är därför hämtade från Internet Archives kopior av Teslas officiella europeiska manualer. Obromsad vikt är utelämnad när källan inte anger den. Den exakta vikten för en enskild bil står i registreringsbeviset. FAQ-svaren om körkort och räckvidd med släp bygger på Škoda Sveriges sida https://www.skoda.se/elbilar/elbil-med-slap, öppnad 23 november 2026.
osakerheter:
- Teslas svenska modelsidor listar inte släpvagnsvikt. Siffrorna kommer från Teslas europeiska ägarmanualer, arkiverade den 13 maj 2026 (Model 3) och den 14 juli 2026 (Model Y).
- Volvo EX40:s supportsida anger 1 500 kilo bromsad släpvagn som en siffra, medan specifikationssidan ger P8 Performance AWD 1 800 kilo. Tabellen följer specifikationssidan per version. Obromsad 750 kilo från supportsidan anges bara för de versioner som supportsidan täcker.
- Volvo EX90:s supportsida gick inte att läsa i sin helhet. Obromsad vikt saknas därför för EX90.
- Volkswagen ID.4 är stängd för nybeställning i Sverige. Den aktuella modelsidan anger upp till 1 200 kilo bromsad last. Den mer detaljerade uppdelningen 1 000 kilo för bakhjulsdrivna Pure och Pro och 1 200 kilo för fyrhjulsdrivna Pro 4MOTION och GTX 4MOTION kommer från Volkswagens svenska modellbroschyr från januari 2024.
- Hyundai Ioniq 5, Ioniq 9 och BYD saknas. Svenska aktuella faktablad med släpvagnsvikt för nuvarande batteristorlekar har inte kunnat verifieras i dag.
- Škodas siffror avser bromsade släp enligt Škoda Sveriges egen FAQ.
