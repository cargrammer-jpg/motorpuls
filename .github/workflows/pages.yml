# Bygger sajten med build.py och publicerar bara _site på GitHub Pages (källor som build.py, content/,
# DESIGN.md, brand/ och drafts/ publiceras inte). Push till main: bygg + publicera. Pull request: bara bygg
# och länkkontroll (ingen publicering). Bygget avbryts om build.py stoppar (t.ex. datum i framtiden) eller
# om någon lokal länk pekar på en fil som saknas.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Bygg till _site
        run: |
          # Schemalagda artiklar har ett framtida datum i sina PR:er; i PR-kontrollen byggs de som om det vore
          # publiceringsdagen. På main gäller riktig tid, så en artikel med framtida datum stoppar publiceringen.
          if [ "${{ github.event_name }}" = "pull_request" ]; then export MOTORPULS_NOW=2100-01-01T00:00+01:00; fi
          python build.py --out _site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
