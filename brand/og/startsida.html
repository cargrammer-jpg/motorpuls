<!doctype html>
<!-- Delningsbild för startsidan (og:image), 1200x630. Rendera med headless Chrome i 1200x630 och spara som
     JPEG till img/og/motorpuls.jpg, t.ex. med Playwright: page.screenshot() och PIL .save(quality=88). -->
<html lang="sv"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Newsreader";src:url(../../fonts/newsreader-var.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"DM Mono";src:url(../../fonts/dmmono-400.woff2) format("woff2");font-weight:400}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0B0D10}
body{position:relative;color:#EEF1F4;
  background:radial-gradient(60rem 28rem at 30% -6rem, rgb(255 91 31 / .22), transparent 70%),
             radial-gradient(40rem 20rem at 100% 110%, rgb(255 91 31 / .10), transparent 70%),#0B0D10}
.card{position:absolute;inset:0;padding:88px 96px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.card img{width:780px;height:auto;display:block}
.line{width:120px;height:4px;background:#FF5B1F;border-radius:2px}
p{margin:0;font-family:"Newsreader",Georgia,serif;font-size:46px;line-height:1.2;color:#C3CAD1;max-width:900px}
.url{position:absolute;left:96px;bottom:64px;font-family:"DM Mono",monospace;font-size:24px;color:#929CA7;letter-spacing:.02em}
.edge{position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,#FF5B1F,rgb(255 91 31 / 0))}
</style></head><body>
<div class="edge"></div>
<div class="card">
  <img src="../final/motorpuls-wordmark-light-on-dark.svg" alt="Motorpuls">
  <div class="line"></div>
  <p>Korta, sakliga bilnyheter.<br>Varje text länkar till sina källor.</p>
</div>
<div class="url">motorpuls.se</div>
</body></html>
